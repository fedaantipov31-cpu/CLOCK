<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#11100f">

    <title>Мировые часы</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- ВСЕ СТИЛИ ПРЯМО ЗДЕСЬ -->
    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family: "Inter", sans-serif;

            background: #0d0d0d;
            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            z-index: -10;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(126, 91, 62, 0.32),
                    transparent 38%
                ),

                radial-gradient(
                    circle at 85% 85%,
                    rgba(100, 100, 100, 0.18),
                    transparent 40%
                ),

                linear-gradient(
                    160deg,
                    #29241f 0%,
                    #171513 35%,
                    #0b0b0b 75%,
                    #050505 100%
                );
        }


        /* =========================
           DECORATION
        ========================= */

        .circle {
            position: absolute;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.18;

            animation: floatCircle 15s ease-in-out infinite;
        }

        .c1 {
            width: 330px;
            height: 330px;

            top: -120px;
            left: -100px;

            background: #9b7250;
        }

        .c2 {
            width: 400px;
            height: 400px;

            right: -150px;
            bottom: -150px;

            background: #686868;

            animation-duration: 20s;
        }

        @keyframes floatCircle {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;

            padding: 24px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           MAIN CARD
        ========================= */

        .glass-card {
            width: 100%;
            max-width: 460px;

            padding: 38px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(42, 39, 36, 0.96),
                    rgba(22, 22, 22, 0.96)
                );

            border: 1px solid rgba(255, 255, 255, 0.10);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px rgba(255, 255, 255, 0.07);

            backdrop-filter: blur(20px);

            animation: cardAppear 0.7s ease;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            width: 78px;
            height: 78px;

            margin: 0 auto 22px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            font-size: 34px;

            background:
                linear-gradient(
                    145deg,
                    #96704f,
                    #5e422f
                );

            border: 1px solid rgba(255, 255, 255, 0.13);

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.35);
        }


        /* =========================
           TITLE
        ========================= */

        #cityTitle {
            text-align: center;

            font-size: 31px;
            font-weight: 700;

            letter-spacing: -0.5px;

            color: #ffffff;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #aeadab;

            font-size: 14px;

            margin-bottom: 28px;
        }


        /* =========================
           TIME BOX
        ========================= */

        .time-box {
            width: 100%;

            padding: 28px 18px;

            margin-bottom: 28px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.035);

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                inset 0 1px rgba(255, 255, 255, 0.04);
        }

        .time {
            text-align: center;

            font-size: 50px;
            font-weight: 700;

            letter-spacing: 3px;

            color: #ffffff;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;
        }

        .time.update {
            transform: scale(1.04);
            opacity: 0.75;
        }

        .date {
            text-align: center;

            margin-top: 12px;

            color: #aaa7a4;

            font-size: 15px;

            line-height: 1.5;
        }


        /* =========================
           CITY BUTTONS
        ========================= */

        .cities {
            display: flex;
            flex-direction: column;

            gap: 11px;
        }

        .city-btn {
            width: 100%;
            height: 54px;

            border-radius: 15px;

            border: 1px solid rgba(255, 255, 255, 0.08);

            background:
                linear-gradient(
                    180deg,
                    #353331,
                    #262523
                );

            color: #eaeaea;

            font-family: inherit;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .city-btn:hover {
            transform: translateY(-2px);

            background:
                linear-gradient(
                    180deg,
                    #574638,
                    #3c3129
                );

            border-color: rgba(255, 255, 255, 0.13);
        }

        .city-btn:active {
            transform: scale(0.97);
        }

        .city-btn.active {
            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #8a6548,
                    #654732
                );

            border-color: rgba(255, 255, 255, 0.16);

            box-shadow:
                0 10px 25px rgba(70, 45, 30, 0.32);
        }


        /* =========================
           КОРИЧНЕВАЯ АНИМАЦИЯ
        ========================= */

        .transition-circle {
            position: fixed;

            width: 70px;
            height: 70px;

            border-radius: 50%;

            background: #6f4e37;

            z-index: 9999;

            pointer-events: none;

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(0);

            will-change: transform, opacity;
        }


        /*
           0 - 0.5 сек:
           круг заполняет экран

           затем экран некоторое время
           полностью коричневый

           потом слой исчезает
        */

        .transition-circle.active {
            animation:
                cityTransition 2.2s ease-in-out forwards;
        }


        @keyframes cityTransition {

            0% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(0);
            }

            25% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(80);
            }

            70% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(80);
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(80);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 520px) {

            body {
                align-items: flex-start;
            }

            .container {
                padding: 16px;
            }

            .glass-card {
                padding: 26px 22px;

                border-radius: 23px;
            }

            .logo {
                width: 66px;
                height: 66px;

                font-size: 29px;

                margin-bottom: 18px;
            }

            #cityTitle {
                font-size: 25px;
            }

            .subtitle {
                font-size: 13px;

                margin-bottom: 22px;
            }

            .time-box {
                padding: 22px 12px;

                margin-bottom: 22px;
            }

            .time {
                font-size: 39px;

                letter-spacing: 2px;
            }

            .date {
                font-size: 14px;
            }

            .city-btn {
                height: 49px;

                font-size: 14px;
            }
        }


        /* =========================
           SMALL PHONE
        ========================= */

        @media (max-width: 360px) {

            .container {
                padding: 10px;
            }

            .glass-card {
                padding: 21px 17px;
            }

            .time {
                font-size: 34px;
            }

            .city-btn {
                height: 46px;
            }
        }


        /* =========================
           TELEGRAM
        ========================= */

        body.telegram {
            color: #ffffff;
        }


        /* =========================
           SELECTION
        ========================= */

        ::selection {
            background: #75543c;
            color: #ffffff;
        }

    </style>

</head>


<body>

    <!-- ФОН -->

    <div class="background">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
    </div>


    <!--
        Этот круг используется script.js
        для эффекта растекания
    -->

    <div
        id="transition"
        class="transition-circle"
    ></div>


    <!-- ПРИЛОЖЕНИЕ -->

    <main class="container">

        <section class="glass-card">

            <div class="logo">
                🕒
            </div>


            <h1 id="cityTitle">
                Москва
            </h1>


            <p class="subtitle">
                Выберите город
            </p>


            <!-- ВРЕМЯ -->

            <div class="time-box">

                <div
                    id="time"
                    class="time"
                >
                    --:--:--
                </div>

                <div
                    id="date"
                    class="date"
                >
                    —
                </div>

            </div>


            <!-- ГОРОДА -->

            <div class="cities">

                <button
                    class="city-btn active"
                    data-city="moscow"
                    type="button"
                >
                    Москва
                </button>


                <button
                    class="city-btn"
                    data-city="petersburg"
                    type="button"
                >
                    Санкт-Петербург
                </button>


                <button
                    class="city-btn"
                    data-city="valday"
                    type="button"
                >
                    Валдай
                </button>


                <button
                    class="city-btn"
                    data-city="london"
                    type="button"
                >
                    Лондон
                </button>


                <button
                    class="city-btn"
                    data-city="milan"
                    type="button"
                >
                    Милан
                </button>

            </div>

        </section>

    </main>


    <!-- JS остаётся отдельным файлом -->

    <script src="./script.js?v=3"></script>

</body>

</html>
