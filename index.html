<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#0f0f0f">

    <title>Мировые часы</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Наш CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =========================
         ФОН
    ========================== -->

    <div class="background">

        <div class="circle c1"></div>

        <div class="circle c2"></div>

    </div>


    <!-- =========================
         КОРИЧНЕВАЯ АНИМАЦИЯ
    ========================== -->

    <div
        id="transition"
        class="transition-circle"
    ></div>


    <!-- =========================
         ПРИЛОЖЕНИЕ
    ========================== -->

    <main class="container">

        <div class="glass-card">


            <!-- ЛОГО -->

            <div class="logo">
                🕒
            </div>


            <!-- ГОРОД -->

            <h1 id="cityTitle">
                Москва
            </h1>


            <p class="subtitle">
                Выберите город
            </p>


            <!-- =========================
                 ВРЕМЯ
            ========================== -->

            <div class="time-box">

                <div
                    id="time"
                    class="time"
                >
                    --:--:--
                </div>


                <div
                    id="date"
                    class="date"
                >
                    —
                </div>

            </div>


            <!-- =========================
                 ГОРОДА
            ========================== -->

            <div class="cities">


                <!-- МОСКВА -->

                <button
                    class="city-btn active"
                    data-city="moscow"
                    type="button"
                >
                    Москва
                </button>


                <!-- САНКТ-ПЕТЕРБУРГ -->

                <button
                    class="city-btn"
                    data-city="petersburg"
                    type="button"
                >
                    Санкт-Петербург
                </button>


                <!-- ВАЛДАЙ -->

                <button
                    class="city-btn"
                    data-city="valday"
                    type="button"
                >
                    Валдай
                </button>


                <!-- ЛОНДОН -->

                <button
                    class="city-btn"
                    data-city="london"
                    type="button"
                >
                    Лондон
                </button>


                <!-- МИЛАН -->

                <button
                    class="city-btn"
                    data-city="milan"
                    type="button"
                >
                    Милан
                </button>


            </div>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
