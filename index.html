<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#0d0d0d">

    <title>Mini App</title>

    <!-- Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family: "Inter", sans-serif;

    background: #0d0d0d;
    color: #ffffff;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}


/* =========================================
   BACKGROUND
========================================= */

.background {

    position: fixed;
    inset: 0;

    z-index: -10;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 15% 10%,
            rgba(126,91,62,.32),
            transparent 38%
        ),

        radial-gradient(
            circle at 85% 85%,
            rgba(100,100,100,.18),
            transparent 40%
        ),

        linear-gradient(
            160deg,
            #29241f 0%,
            #171513 35%,
            #0b0b0b 75%,
            #050505 100%
        );
}


/* =========================================
   DECORATION
========================================= */

.circle {

    position: absolute;

    border-radius: 50%;

    filter: blur(100px);

    opacity: .18;

    animation: floatCircle 15s ease-in-out infinite;
}

.c1 {

    width: 330px;
    height: 330px;

    top: -120px;
    left: -100px;

    background: #9b7250;
}

.c2 {

    width: 400px;
    height: 400px;

    right: -150px;
    bottom: -150px;

    background: #686868;

    animation-duration: 20s;
}

@keyframes floatCircle {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-30px);
    }
}


/* =========================================
   CONTAINER
========================================= */

.container {

    width: 100%;

    min-height: 100vh;

    padding: 24px;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================================
   CARD
========================================= */

.card {

    width: 100%;
    max-width: 460px;

    padding: 38px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(42,39,36,.96),
            rgba(22,22,22,.96)
        );

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.07);

    backdrop-filter: blur(20px);

    animation: cardAppear .55s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================
   SCREENS
========================================= */

.screen {
    display: none;
}

.screen.active {
    display: block;
}


/* =========================================
   LOGO
========================================= */

.logo {

    width: 78px;
    height: 78px;

    margin: 0 auto 22px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 34px;

    background:
        linear-gradient(
            145deg,
            #96704f,
            #5e422f
        );

    border:
        1px solid rgba(255,255,255,.13);

    box-shadow:
        0 15px 35px rgba(0,0,0,.35);
}


/* =========================================
   TEXT
========================================= */

.title {

    text-align: center;

    font-size: 31px;

    font-weight: 700;

    letter-spacing: -.5px;

    margin-bottom: 9px;
}

.subtitle {

    text-align: center;

    color: #aaa7a4;

    font-size: 14px;

    line-height: 1.6;

    margin-bottom: 30px;
}


/* =========================================
   MAIN MENU
========================================= */

.menu {

    display: flex;

    flex-direction: column;

    gap: 14px;
}


/* =========================================
   MENU BUTTON
========================================= */

.menu-btn {

    position: relative;

    width: 100%;

    min-height: 72px;

    padding: 0 20px;

    border-radius: 18px;

    border:
        1px solid rgba(255,255,255,.09);

    color: #ffffff;

    background:
        linear-gradient(
            145deg,
            #5b4332,
            #382e27
        );

    font-family: inherit;

    cursor: pointer;

    display: flex;

    align-items: center;

    gap: 16px;

    text-align: left;

    box-shadow:
        0 10px 25px rgba(0,0,0,.22);

    transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.menu-btn:hover {

    transform: translateY(-3px);

    border-color:
        rgba(255,255,255,.17);

    background:
        linear-gradient(
            145deg,
            #76563f,
            #47372c
        );

    box-shadow:
        0 16px 32px rgba(0,0,0,.30);
}

.menu-btn:active {

    transform: scale(.975);
}


/* =========================================
   BUTTON ICON
========================================= */

.menu-icon {

    width: 44px;
    height: 44px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 13px;

    font-size: 22px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.07);
}


/* =========================================
   BUTTON TEXT
========================================= */

.menu-text {

    display: flex;

    flex-direction: column;

    gap: 4px;
}

.menu-title {

    font-size: 16px;

    font-weight: 700;
}

.menu-description {

    color: #bbb6b1;

    font-size: 12px;

    font-weight: 400;
}

.menu-arrow {

    margin-left: auto;

    color: #c5b7ac;

    font-size: 20px;
}


/* =========================================
   DISABLED BUTTON
========================================= */

.menu-btn.disabled {

    opacity: .48;

    cursor: default;
}

.menu-btn.disabled:hover {

    transform: none;

    background:
        linear-gradient(
            145deg,
            #5b4332,
            #382e27
        );

    box-shadow:
        0 10px 25px rgba(0,0,0,.22);
}


/* =========================================
   CLOCK HEADER
========================================= */

.clock-header {

    position: relative;

    margin-bottom: 24px;
}

.back-btn {

    position: absolute;

    top: 0;
    left: 0;

    width: 42px;
    height: 42px;

    border: 1px solid rgba(255,255,255,.08);

    border-radius: 13px;

    background:
        rgba(255,255,255,.05);

    color: white;

    font-size: 20px;

    cursor: pointer;

    transition: .2s ease;
}

.back-btn:hover {

    background:
        rgba(255,255,255,.10);
}

.back-btn:active {

    transform: scale(.94);
}


/* =========================================
   CLOCK LOGO
========================================= */

.clock-logo {

    width: 68px;
    height: 68px;

    margin: 0 auto 18px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 30px;

    background:
        linear-gradient(
            145deg,
            #96704f,
            #5e422f
        );
}


/* =========================================
   TIME
========================================= */

.time-box {

    width: 100%;

    padding: 28px 18px;

    margin-bottom: 26px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.08);
}

.time {

    text-align: center;

    font-size: 50px;

    font-weight: 700;

    letter-spacing: 3px;

    transition:
        transform .25s ease,
        opacity .25s ease;
}

.time.update {

    transform: scale(1.04);

    opacity: .72;
}

.date {

    margin-top: 12px;

    text-align: center;

    color: #aaa7a4;

    font-size: 15px;
}


/* =========================================
   CITIES
========================================= */

.cities {

    display: flex;

    flex-direction: column;

    gap: 11px;
}

.city-btn {

    width: 100%;

    height: 52px;

    border-radius: 15px;

    border:
        1px solid rgba(255,255,255,.08);

    background:
        linear-gradient(
            180deg,
            #353331,
            #262523
        );

    color: #eaeaea;

    font-family: inherit;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.city-btn:hover {

    transform: translateY(-2px);

    background:
        linear-gradient(
            180deg,
            #574638,
            #3c3129
        );
}

.city-btn:active {

    transform: scale(.97);
}

.city-btn.active {

    background:
        linear-gradient(
            135deg,
            #8a6548,
            #654732
        );

    box-shadow:
        0 10px 25px rgba(70,45,30,.32);
}


/* =========================================
   CITY TRANSITION
========================================= */

.transition-circle {

    position: fixed;

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background: #6f4e37;

    z-index: 9999;

    pointer-events: none;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(0);
}

.transition-circle.active {

    animation:
        cityTransition 2.2s ease-in-out forwards;
}

@keyframes cityTransition {

    0% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    25% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(80);
    }

    70% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(80);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(80);
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 520px) {

    body {
        align-items: flex-start;
    }

    .container {
        padding: 16px;
    }

    .card {

        padding: 27px 22px;

        border-radius: 23px;
    }

    .logo {

        width: 68px;
        height: 68px;

        font-size: 30px;
    }

    .title {

        font-size: 26px;
    }

    .menu-btn {

        min-height: 68px;
    }

    .time {

        font-size: 39px;
    }

    .date {

        font-size: 14px;
    }
}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="background">

    <div class="circle c1"></div>

    <div class="circle c2"></div>

</div>


<!-- АНИМАЦИЯ ГОРОДА -->

<div
    id="transition"
    class="transition-circle"
></div>


<main class="container">

    <section class="card">


        <!-- =====================================
             ГЛАВНОЕ МЕНЮ
        ====================================== -->

        <div
            id="homeScreen"
            class="screen active"
        >


            <div class="logo">
                ◆
            </div>


            <h1 class="title">
                Главное меню
            </h1>


            <p class="subtitle">
                Выберите приложение
            </p>


            <div class="menu">


                <!-- Gmail -->

                <button
                    id="gmailButton"
                    class="menu-btn"
                    type="button"
                >

                    <div class="menu-icon">
                        ✉
                    </div>

                    <div class="menu-text">

                        <span class="menu-title">
                            Gmail
                        </span>

                        <span class="menu-description">
                            Открыть электронную почту
                        </span>

                    </div>

                    <div class="menu-arrow">
                        ›
                    </div>

                </button>


                <!-- WORLD CLOCK -->

                <button
                    id="clockButton"
                    class="menu-btn"
                    type="button"
                >

                    <div class="menu-icon">
                        ◷
                    </div>

                    <div class="menu-text">

                        <span class="menu-title">
                            Мировые часы
                        </span>

                        <span class="menu-description">
                            Время в разных городах
                        </span>

                    </div>

                    <div class="menu-arrow">
                        ›
                    </div>

                </button>


                <!-- EMPTY -->

                <button
                    id="thirdButton"
                    class="menu-btn disabled"
                    type="button"
                >

                    <div class="menu-icon">
                        +
                    </div>

                    <div class="menu-text">

                        <span class="menu-title">
                            Скоро
                        </span>

                        <span class="menu-description">
                            Здесь появится новое приложение
                        </span>

                    </div>

                </button>


            </div>

        </div>


        <!-- =====================================
             ЧАСЫ
        ====================================== -->

        <div
            id="clockScreen"
            class="screen"
        >


            <div class="clock-header">

                <button
                    id="backButton"
                    class="back-btn"
                    type="button"
                >
                    ←
                </button>


                <div class="clock-logo">
                    🕒
                </div>


                <h1
                    id="cityTitle"
                    class="title"
                >
                    Москва
                </h1>


                <p class="subtitle">
                    Выберите город
                </p>

            </div>


            <div class="time-box">

                <div
                    id="time"
                    class="time"
                >
                    --:--:--
                </div>


                <div
                    id="date"
                    class="date"
                >
                    —
                </div>

            </div>


            <div class="cities">


                <button
                    class="city-btn active"
                    data-city="moscow"
                >
                    Москва
                </button>


                <button
                    class="city-btn"
                    data-city="petersburg"
                >
                    Санкт-Петербург
                </button>


                <button
                    class="city-btn"
                    data-city="valday"
                >
                    Валдай
                </button>


                <button
                    class="city-btn"
                    data-city="london"
                >
                    Лондон
                </button>


                <button
                    class="city-btn"
                    data-city="milan"
                >
                    Милан
                </button>


            </div>

        </div>


    </section>

</main>


<script src="./script.js?v=10"></script>

</body>

</html>
